#!/usr/bin/env python3
"""
chezmoi modify script for ~/.codex/config.toml

Static user preferences are enforced; runtime state ([notice.*], [marketplaces.*],
[projects.*]) is left untouched so Codex continues to function normally.
"""
import sys

OVERRIDES = {
    "model": 'model = "gpt-5.4"',
    "sandbox_mode": 'sandbox_mode = "danger-full-access"',
    "model_reasoning_effort": 'model_reasoning_effort = "high"',
    "personality": 'personality = "pragmatic"',
}

lines = sys.stdin.read().splitlines()
output = []
seen_keys = set()

for line in lines:
    stripped = line.strip()
    matched = False
    for key, replacement in OVERRIDES.items():
        if stripped.startswith(f"{key} =") and not stripped.startswith("#"):
            output.append(replacement)
            seen_keys.add(key)
            matched = True
            break
    if not matched:
        output.append(line)

# If config.toml doesn't exist yet (new machine), start with full static config
missing = [v for k, v in OVERRIDES.items() if k not in seen_keys]
if missing and not output:
    output = list(OVERRIDES.values()) + ["", "[features]", "js_repl = true", "memories = true", "external_migration = true"]

print("\n".join(output))
