#!/bin/sh
awk -v 'model_line=model = "gpt-6.2-sol"' '
  BEGIN { in_root = 1 }
  in_root && /^[[:space:]]*\[/ {
    if (!model_seen) {
      print model_line
      print ""
    }
    in_root = 0
  }
  in_root && /^[[:space:]]*(model|"model"|\047model\047)[[:space:]]*=/ {
    if (!model_seen) print model_line
    model_seen = 1
    next
  }
  { print }
  END {
    if (in_root && !model_seen) print model_line
  }
'
