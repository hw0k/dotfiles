#!/bin/sh
# Keep Codex defaults in sync without replacing machine-local configuration.
awk '
  BEGIN { in_root = 1 }
  in_root && /^\[/ {
    if (!model_seen) print "model = \"gpt-6-sol\""
    if (!effort_seen) print "model_reasoning_effort = \"high\""
    if (!model_seen || !effort_seen) print ""
    in_root = 0
  }
  in_root && /^[[:space:]]*model[[:space:]]*=/ {
    if (!model_seen) print "model = \"gpt-6-sol\""
    model_seen = 1
    next
  }
  in_root && /^[[:space:]]*model_reasoning_effort[[:space:]]*=/ {
    if (!effort_seen) print "model_reasoning_effort = \"high\""
    effort_seen = 1
    next
  }
  { print }
  END {
    if (in_root) {
      if (!model_seen) print "model = \"gpt-6-sol\""
      if (!effort_seen) print "model_reasoning_effort = \"high\""
    }
  }
'
